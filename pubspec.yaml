name: shotkit
description: An offline-first shot list and on-set companion for filmmakers.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: ^2.34.2
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.0
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  sqlite3_flutter_libs: ^0.6.0+eol
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Archivo.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: ArchivoSemiCondensed
      fonts:
        - asset: assets/fonts/ArchivoSemiCondensed-ExtraBold.ttf
          weight: 800
    - family: ArchivoCondensed
      fonts:
        - asset: assets/fonts/ArchivoCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/ArchivoCondensed-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
